services:
  qwen3-tts:
    image: ghcr.io/xpsixx/qwen3-tts-rocm:latest
    container_name: qwen3-tts
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      # All config via .env — copy .env.example to .env and edit.
      - QWEN_TTS_MODEL=${QWEN_TTS_MODEL}          # REQUIRED: which model to download & serve
      - QWEN_TTS_DEVICE=${QWEN_TTS_DEVICE:-cuda:0}
      - QWEN_TTS_ATTN=${QWEN_TTS_ATTN:-sdpa}
      - QWEN_TTS_VOICE=${QWEN_TTS_VOICE:-Ryan}
      - HF_HOME=/models
    ports:
      - "${QWEN_TTS_PORT:-3447}:3447"
    volumes:
      - ./models:/models
