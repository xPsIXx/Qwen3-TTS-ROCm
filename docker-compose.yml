services:
  qwen3-tts:
    image: ghcr.io/xpsixx/qwen3-tts-rocm:latest
    container_name: qwen3-tts
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - QWEN_TTS_MODEL=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - QWEN_TTS_DEVICE=cuda:0
      - QWEN_TTS_ATTN=sdpa
      - QWEN_TTS_VOICE=Ryan
      - HF_HOME=/models
    ports:
      - "3447:3447"
    volumes:
      - ./models:/models
